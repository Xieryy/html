<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Cgrid{
            display: grid;
            gap: 10px;
            padding: 10px;
            margin: 5px;
            grid-template-columns: auto auto auto; 
            justify-content: space-evenly;
            background-color: orange;
        }
        .Rgrid{
            display: grid;
            gap: 10px;
            padding: 10px;
            margin: 5px;
            grid-template-rows: auto auto auto; 
            justify-content: space-evenly;
            background-color: orange;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: blue;
        }
        .center {
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
            background-color: lightgray;
        }
        .end {
            border: 1px solid black;
            display: flex;
            justify-content: end;
            align-items: end;
            width: 200px;
            height: 200px;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <div style="display: flex; flex-wrap: wrap; width: 405px;">

        <div class="center">
            <div class="Cgrid">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>
    
        <div class="center">
            <div class="Rgrid">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>
        
        <div class="end">
            <div class="Cgrid">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>
    
        <div class="end">
            <div class="Rgrid">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>

    </div>
    
</body>
</html>
