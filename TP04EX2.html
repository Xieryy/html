<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
    <style>
        .column{
            border: 1px solid black;
            background-color: lightgray;
            display: flex;
            flex-direction: column;
            width: 200px;
            height: 200px;
        }
        .row{
            border: 1px solid black;
            background-color: lightgray;
            display: flex;
            flex-direction: row;
            width: 200px;
            height: 200px;
        }
        .top{
            flex-grow: 1;
            width: 50px;
            height: 50px;
            align-self: stretch;
            background-color: orange
        }
        .center{
            flex-grow: 1;
            width: 50px;
            height: 50px;
            align-self: center;
            background-color: orange
        }
        .left{
            flex-grow: 1;
            width: 50px;
            height: 50px;
            align-self: stretch;
            background-color: orange
        }
        .right{
            flex-grow: 1;
            width: 50px;
            height: 50px;
            align-self: stretch;
            align-self: flex-end;
            background-color: orange
        }
    
    </style>
    <div style="display: flex; flex-wrap: wrap; width: 405px;">
        <div class="row">
            <div class="top"></div>
        </div>

        <div class="column">
            <div class="left"></div>
        </div>

        <div class="row">
            <div class="center"></div>
        </div>

        <div class="column">
            <div class="right"></div>
        </div>

    </div>
</head>
<body>
    
</body>
</html>
