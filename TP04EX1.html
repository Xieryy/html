<!DOCTYPE html>
<html>
    <head>
        <style>
            .topLeft {
                display: flex;
                justify-content: flex-start;
                align-items: flex-start;
                background-color: yellow;
                height: 200px;
                width: 200px;
            }
            .center {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: black;
                height: 200px;
                width: 200px;
            }
            .bottomLeft {
                display: flex;
                justify-content: flex-start;
                align-items: flex-end;
                background-color: yellow;
                height: 200px;
                width: 200px;
            }
            .centerLeft {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                background-color: black;
                height: 200px;
                width: 200px;
            }
            .child{
                width: 50px;
                height: 50px;
                background-color: red;
            }
        </style>
    </head>
    <body>
        <div style="display: flex;">
        <div class="topLeft">
            <div class="child"></div>
        </div>
        <div class="center">
            <div class="child"></div>
        </div>
        <div class="bottomLeft">
            <div class="child"></div>
        </div>
        <div class="centerLeft">
            <div class="child"></div>
        </div>
        </div>
        

    </body>
</html>
