<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Generator</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h1 {
            display: flex;
            justify-content: flex-start;
            font-size: 15px;
            padding: 10px;

        }
        #container {
            border: 2px solid black;
            padding: 10px;
            margin: 30px auto;
            width: 300px;
            border-radius: 8px;
            background-color: white;
        }
        #color-box {
            padding: 15px;
            background: black;
            color: white;
            font-size: 24px;
            margin: 20px auto;
            border-radius: 8px;
        }
        #background {
            padding: 10px;
        }
        button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }
        button:hover {
            background-color: black;
            color: white;
        }
        #history {
            margin: 20px 100px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .color-box {
            width: 20px;
            height: 20px;
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <div id="container">
        <h1>Random Color Generator</h1>

        <div id="background">  
            <div id="color-box">
                Background Color: 
                <span id="color-display">#FFFFFF</span>
            </div>

            <button id="generate-btn">GENERATE</button>
            <button id="reset-btn">RESET</button>
        </div>

        <h3>Color History:</h3>
        <div id="history"></div>
    </div>

    <script>
        class Color {
            constructor(type = "HEX") {
                this.colorType = type;
                this.records = [];
            }

            getRandomNumber() {
                let hex = "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
                return hex.toUpperCase();
            }

            generate() {
                let newColor = this.getRandomNumber();
                this.records.push(newColor);
                document.getElementById("background").style.backgroundColor = newColor;
                document.getElementById("color-display").innerText = newColor;
                document.getElementById("color-display").style.color = newColor;

                this.updateHistory();
            }

            getRecords() {
                return this.records;
            }

            reset() {
                this.records = [];
                this.updateHistory();
            }

            updateHistory() {
                let historyDiv = document.getElementById("history");
                historyDiv.innerHTML = "";
                this.records.forEach(color => {
                    let div = document.createElement("div");
                    div.className = "history-item";
                    div.textContent = color;

                    let colorBox = document.createElement("div");
                    colorBox.className = "color-box";
                    colorBox.style.backgroundColor = color;

                    div.appendChild(colorBox);
                    historyDiv.appendChild(div);
                });
            }
        }

        const colorGenerator = new Color();

        document.getElementById("generate-btn").onclick = function(){
            colorGenerator.generate();
        }
        document.getElementById("reset-btn").onclick = function(){
            colorGenerator.reset();
        }
    </script>
</body>
</html>
