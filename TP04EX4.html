<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Cnest{
            border: 1px solid black;
            background-color: lightgray;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            width: 200px;
            height: 200px;
        }
        .Rnest{
            border: 1px solid black;
            background-color: lightgray;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            width: 200px;
            height: 200px;
        }
        .nest{

        }
        .start{
            flex-grow: 1;
            width: 50px;
            height: 50px;
            align-self: flex-start;
            background-color: orange;
        }
        .center{
            flex-grow: 1;
            width: 50px;
            height: 50px;
            align-self: center;
            background-color: orange;
        }
        .end{
            flex-grow: 1;
            width: 50px;
            height: 50px;
            align-self: flex-end;
            background-color: orange;
        }
    </style>
</head>
<body>
    <div style="display: flex; flex-wrap: wrap; width: 405px;">

        <div class="Cnest">
            <div class="start"></div>
        </div>

        <div class="Rnest">
            <div class="start center end"></div>
        </div>

    </div>
</body>
</html>
