<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>
    <style>
        .background{
            background-color: lightgray;
            justify-content: space-evenly;
            width: 200px;
            height: 200px;
            display: grid;
            padding: 5px;
        }
        .flex{
            flex-grow: 0;
            background-color: orange;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .column{
            flex-direction: column;
            width: 60px;
        }
        .row{
            flex-direction: row;
            width: 190px;
            height: 60px;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: blue;
        }

    </style>
</head>
<body>
    <div style="display: flex; flex-wrap: wrap; width: 420px;">
          <div class="background" style="display: flex;">
            <div class = "flex column"></div>
            <div class = "flex column">
                <div class = "box"></div>
                <div class = "box"></div>
                <div class = "box"></div>
            </div>
            <div class = "flex column"></div>
          </div>

        <div class="background">
            <div class = "flex row"></div>
            <div class = "flex row">
                <div class = "box"></div>
                <div class = "box"></div>
                <div class = "box"></div>
            </div>
            <div class = "flex row"></div>
        </div>
    </div>
</body>
</html>
